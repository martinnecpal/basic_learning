<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vektor v 3D — interaktívna vizualizácia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
<script>
  // Match the theme the user chose on the main site (localStorage is shared, same origin).
  (function () {
    var saved = localStorage.getItem('theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<style>
  :root {
    --bg: #ffffff;
    --bg-elevated: #f6f7f9;
    --text: #1c1f24;
    --text-muted: #5b6270;
    --border: #e3e5e9;
    --accent: #2b6cb0;
    --accent-soft: #e8f0fb;
    --shadow: 0 4px 16px rgba(20, 22, 30, 0.08);
    --axis-x: #d9534f;
    --axis-y: #3f9142;
    --axis-z: #2b6cb0;
    --vector-color: #a94bd1;
    --unit-color: #e08a1e;
  }
  :root[data-theme="dark"] {
    --bg: #14161b;
    --bg-elevated: #1b1e25;
    --text: #e7e9ee;
    --text-muted: #9aa2b1;
    --border: #2a2e37;
    --accent: #6ea8e8;
    --accent-soft: #1e2a3d;
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161b;
      --bg-elevated: #1b1e25;
      --text: #e7e9ee;
      --text-muted: #9aa2b1;
      --border: #2a2e37;
      --accent: #6ea8e8;
      --accent-soft: #1e2a3d;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .app { position: relative; width: 100vw; height: 100vh; }
  #scene { position: absolute; inset: 0; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
    padding: 0.7rem 1rem;
    background: linear-gradient(to bottom, var(--bg) 0%, transparent 100%);
    pointer-events: none;
  }
  header a, header .title, header button { pointer-events: auto; }
  .back-link {
    flex-shrink: 0;
    color: var(--text-muted); text-decoration: none; font-size: 0.85rem;
    background: var(--bg-elevated); border: 1px solid var(--border);
    padding: 0.35rem 0.7rem; border-radius: 20px;
  }
  .back-link:hover { color: var(--accent); border-color: var(--accent); }
  .title {
    font-size: 0.95rem; font-weight: 600; text-align: right;
    min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .title small { display: block; font-weight: 400; color: var(--text-muted); font-size: 0.72rem; }

  #panel-toggle {
    display: none;
    flex-shrink: 0;
    background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text);
    border-radius: 20px; padding: 0.35rem 0.8rem; font-size: 0.85rem; cursor: pointer;
    pointer-events: auto;
  }

  aside#panel {
    position: absolute; top: 3.2rem; right: 1rem; z-index: 10;
    width: 268px; max-height: calc(100vh - 4.4rem); overflow-y: auto;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow);
    padding: 0.9rem 1rem 1.1rem;
    font-size: 0.85rem;
  }
  aside#panel h2 {
    margin: 0 0 0.6rem; font-size: 0.78rem; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--text-muted); font-weight: 700;
  }
  .row { display: flex; align-items: center; gap: 0.5rem; margin: 0.35rem 0; }
  .row label { flex: 0 0 1.1rem; font-weight: 700; }
  .row.x label { color: var(--axis-x); }
  .row.y label { color: var(--axis-y); }
  .row.z label { color: var(--axis-z); }
  .row input[type="range"] { flex: 1; }
  .row input[type="number"] {
    width: 3.4rem; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 0.15rem 0.3rem;
    font-size: 0.85rem;
  }

  .presets { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0 0.9rem; }
  .presets button {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 0.3rem 0.5rem; font-size: 0.76rem; cursor: pointer;
  }
  .presets button:hover { border-color: var(--accent); color: var(--accent); }

  .toggles { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.9rem; }
  .toggles label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }

  .stats { border-top: 1px solid var(--border); padding-top: 0.7rem; line-height: 1.55; }
  .stats .k { color: var(--text-muted); }
  .stats .formula { font-family: "Cambria Math", Cambria, Georgia, serif; }

  #reset-view {
    width: 100%; margin-top: 0.8rem;
    background: var(--accent-soft); color: var(--accent); border: none;
    border-radius: 8px; padding: 0.4rem 0.6rem; font-size: 0.8rem; cursor: pointer;
    font-weight: 600;
  }
  #reset-view:hover { filter: brightness(0.95); }

  footer {
    position: absolute; bottom: 0.7rem; left: 50%; transform: translateX(-50%); z-index: 10;
    color: var(--text-muted); font-size: 0.74rem; text-align: center;
    background: var(--bg-elevated); border: 1px solid var(--border);
    padding: 0.3rem 0.8rem; border-radius: 20px; white-space: nowrap;
  }

  .axis-label {
    position: absolute; font-weight: 700; font-size: 0.85rem;
    transform: translate(-50%, -50%);
    text-shadow: 0 0 4px var(--bg), 0 0 4px var(--bg), 0 0 8px var(--bg);
  }
  .vec-label {
    position: absolute; font-weight: 600; font-size: 0.8rem;
    background: var(--bg-elevated); border: 1px solid var(--border);
    padding: 0.1rem 0.4rem; border-radius: 6px;
    transform: translate(8px, -50%);
    white-space: nowrap;
  }

  @media (max-width: 640px) {
    #panel-toggle { display: block; }
    .title small { display: none; }
    aside#panel { display: none; width: calc(100vw - 2rem); right: 1rem; left: 1rem; }
    aside#panel.is-open { display: block; }
    footer { max-width: calc(100vw - 2rem); white-space: normal; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="scene"></div>
  <div id="labels"></div>

  <header>
    <a class="back-link" href="../../chapters/vektory/">← Späť do kapitoly</a>
    <span class="title">Vektor v 3D<small>interaktívna vizualizácia</small></span>
    <button id="panel-toggle" aria-controls="panel" aria-expanded="false">Nastavenia</button>
  </header>

  <aside id="panel">
    <h2>Zložky vektora v</h2>
    <div class="row x">
      <label for="vx">x</label>
      <input type="range" id="vx-range" min="-6" max="6" step="0.5" value="3">
      <input type="number" id="vx" min="-6" max="6" step="0.5" value="3">
    </div>
    <div class="row y">
      <label for="vy">y</label>
      <input type="range" id="vy-range" min="-6" max="6" step="0.5" value="-2">
      <input type="number" id="vy" min="-6" max="6" step="0.5" value="-2">
    </div>
    <div class="row z">
      <label for="vz">z</label>
      <input type="range" id="vz-range" min="-6" max="6" step="0.5" value="5">
      <input type="number" id="vz" min="-6" max="6" step="0.5" value="5">
    </div>

    <div class="presets">
      <button data-v="2,1,4">(2, 1, 4)</button>
      <button data-v="3,-2,5">(3, −2, 5)</button>
      <button data-v="3,-2,6">(3, −2, 6)</button>
      <button data-v="1,1,1">(1, 1, 1)</button>
    </div>

    <h2>Zobrazenie</h2>
    <div class="toggles">
      <label><input type="checkbox" id="show-basis" checked> Bázové vektory e<sub>x</sub>, e<sub>y</sub>, e<sub>z</sub></label>
      <label><input type="checkbox" id="show-components" checked> Priemety (zložky) vektora</label>
      <label><input type="checkbox" id="show-unit"> Jednotkový vektor v̂</label>
      <label><input type="checkbox" id="auto-rotate"> Automatická rotácia</label>
    </div>

    <div class="stats" id="stats"></div>

    <button id="reset-view">Reset pohľadu</button>
  </aside>

  <footer>Rotácia: ťahanie ľavým tlačidlom · Zoom: koliesko myši · Posun: pravé tlačidlo</footer>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const sceneEl = document.getElementById('scene');
const labelsEl = document.getElementById('labels');

const css = getComputedStyle(document.documentElement);
const colorX = css.getPropertyValue('--axis-x').trim();
const colorY = css.getPropertyValue('--axis-y').trim();
const colorZ = css.getPropertyValue('--axis-z').trim();
const colorVector = css.getPropertyValue('--vector-color').trim();
const colorUnit = css.getPropertyValue('--unit-color').trim();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
sceneEl.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 30;
controls.autoRotateSpeed = 1.4;

const DEFAULT_CAMERA = new THREE.Vector3(11, 9, 13);
camera.position.copy(DEFAULT_CAMERA);
controls.target.set(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 1));

// Math convention (x, y, z) is mapped onto three.js coords as (x, z, y),
// so the z-axis renders vertically — the usual orientation for planes/normals.
function toThree(x, y, z) {
  return new THREE.Vector3(x, z, y);
}

const AXIS_LEN = 6;
const axesGroup = new THREE.Group();
scene.add(axesGroup);

function addAxis(dir, color) {
  const positive = new THREE.ArrowHelper(dir, new THREE.Vector3(0, 0, 0), AXIS_LEN, color, 0.32, 0.16);
  axesGroup.add(positive);
  const negGeom = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0),
    dir.clone().multiplyScalar(-AXIS_LEN * 0.4)
  ]);
  const negMat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.35 });
  axesGroup.add(new THREE.Line(negGeom, negMat));
  return dir.clone().multiplyScalar(AXIS_LEN + 0.6);
}

const axisLabelPositions = {
  x: addAxis(new THREE.Vector3(1, 0, 0), colorX),
  y: addAxis(new THREE.Vector3(0, 0, 1), colorY),
  z: addAxis(new THREE.Vector3(0, 1, 0), colorZ)
};

const grid = new THREE.GridHelper(AXIS_LEN * 2, AXIS_LEN * 2, 0x888888, 0x888888);
grid.material.transparent = true;
grid.material.opacity = 0.12;
scene.add(grid);

const basisGroup = new THREE.Group();
scene.add(basisGroup);
function buildBasis() {
  basisGroup.clear();
  const specs = [
    [new THREE.Vector3(1, 0, 0), colorX],
    [new THREE.Vector3(0, 0, 1), colorY],
    [new THREE.Vector3(0, 1, 0), colorZ]
  ];
  specs.forEach(([dir, color]) => {
    basisGroup.add(new THREE.ArrowHelper(dir, new THREE.Vector3(0, 0, 0), 1, color, 0.16, 0.1));
  });
}
buildBasis();

let vectorArrow = null;
let unitArrow = null;
const componentsGroup = new THREE.Group();
scene.add(componentsGroup);

function makeDashedLine(points, color) {
  const geom = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineDashedMaterial({ color, dashSize: 0.18, gapSize: 0.12, transparent: true, opacity: 0.7 });
  const line = new THREE.Line(geom, mat);
  line.computeLineDistances();
  return line;
}

// --- HTML label layer (projected each frame) ---
const labels = [];
function addLabel(text, className, color) {
  const el = document.createElement('div');
  el.className = className;
  el.textContent = text;
  if (color) el.style.color = color;
  labelsEl.appendChild(el);
  const entry = { el, position: new THREE.Vector3() };
  labels.push(entry);
  return entry;
}

const axisLabels = {
  x: addLabel('x', 'axis-label', colorX),
  y: addLabel('y', 'axis-label', colorY),
  z: addLabel('z', 'axis-label', colorZ)
};
axisLabels.x.position.copy(axisLabelPositions.x);
axisLabels.y.position.copy(axisLabelPositions.y);
axisLabels.z.position.copy(axisLabelPositions.z);

const originLabel = addLabel('O', 'axis-label', null);
originLabel.position.set(0, 0, 0);

const vectorLabel = addLabel('v', 'vec-label', colorVector);
vectorLabel.el.style.display = 'none';
const unitLabel = addLabel('v̂', 'vec-label', colorUnit);
unitLabel.el.style.display = 'none';

// --- State + inputs ---
const state = { vx: 3, vy: -2, vz: 5, showBasis: true, showComponents: true, showUnit: false };

const vxRange = document.getElementById('vx-range');
const vyRange = document.getElementById('vy-range');
const vzRange = document.getElementById('vz-range');
const vxNum = document.getElementById('vx');
const vyNum = document.getElementById('vy');
const vzNum = document.getElementById('vz');
const statsEl = document.getElementById('stats');

function fmt(n) {
  const r = Math.round(n * 100) / 100;
  return Object.is(r, -0) ? '0' : r.toString().replace('.', ',');
}

function syncInputs() {
  vxRange.value = state.vx; vxNum.value = state.vx;
  vyRange.value = state.vy; vyNum.value = state.vy;
  vzRange.value = state.vz; vzNum.value = state.vz;
}

function bindPair(rangeEl, numEl, key) {
  const handler = (val) => {
    state[key] = parseFloat(val);
    syncInputs();
    updateVector();
  };
  rangeEl.addEventListener('input', (e) => handler(e.target.value));
  numEl.addEventListener('input', (e) => { if (e.target.value !== '' && !isNaN(e.target.value)) handler(e.target.value); });
}
bindPair(vxRange, vxNum, 'vx');
bindPair(vyRange, vyNum, 'vy');
bindPair(vzRange, vzNum, 'vz');

document.querySelectorAll('.presets button').forEach((btn) => {
  btn.addEventListener('click', () => {
    const [x, y, z] = btn.dataset.v.split(',').map(Number);
    state.vx = x; state.vy = y; state.vz = z;
    syncInputs();
    updateVector();
  });
});

document.getElementById('show-basis').addEventListener('change', (e) => {
  state.showBasis = e.target.checked;
  basisGroup.visible = state.showBasis;
});
document.getElementById('show-components').addEventListener('change', (e) => {
  state.showComponents = e.target.checked;
  updateVector();
});
document.getElementById('show-unit').addEventListener('change', (e) => {
  state.showUnit = e.target.checked;
  updateVector();
});
document.getElementById('auto-rotate').addEventListener('change', (e) => {
  controls.autoRotate = e.target.checked;
});

document.getElementById('reset-view').addEventListener('click', () => {
  camera.position.copy(DEFAULT_CAMERA);
  controls.target.set(0, 0, 0);
  controls.update();
});

const panelToggle = document.getElementById('panel-toggle');
const panel = document.getElementById('panel');
panelToggle.addEventListener('click', () => {
  const open = panel.classList.toggle('is-open');
  panelToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
});

function updateVector() {
  if (vectorArrow) { scene.remove(vectorArrow); vectorArrow = null; }
  if (unitArrow) { scene.remove(unitArrow); unitArrow = null; }
  componentsGroup.clear();

  const { vx, vy, vz } = state;
  const tip3 = toThree(vx, vy, vz);
  const length = tip3.length();
  const mag = Math.sqrt(vx * vx + vy * vy + vz * vz);

  if (length > 1e-6) {
    const dir = tip3.clone().normalize();
    vectorArrow = new THREE.ArrowHelper(dir, new THREE.Vector3(0, 0, 0), length, colorVector, Math.min(0.4, length * 0.25), Math.min(0.22, length * 0.15));
    scene.add(vectorArrow);
    vectorLabel.el.style.display = '';
    vectorLabel.position.copy(tip3);

    if (state.showUnit) {
      const unitDir = dir.clone();
      unitArrow = new THREE.ArrowHelper(unitDir, new THREE.Vector3(0, 0, 0), 1, colorUnit, 0.16, 0.1);
      scene.add(unitArrow);
      unitLabel.el.style.display = '';
      unitLabel.position.copy(unitDir);
    } else {
      unitLabel.el.style.display = 'none';
    }
  } else {
    vectorLabel.el.style.display = 'none';
    unitLabel.el.style.display = 'none';
  }

  if (state.showComponents && length > 1e-6) {
    const p0 = new THREE.Vector3(0, 0, 0);
    const p1 = toThree(vx, 0, 0);
    const p2 = toThree(vx, vy, 0);
    const p3 = tip3;
    componentsGroup.add(makeDashedLine([p0, p1], colorX));
    componentsGroup.add(makeDashedLine([p1, p2], colorY));
    componentsGroup.add(makeDashedLine([p2, p3], colorZ));
  }

  const unitText = mag > 1e-6
    ? `(${fmt(vx / mag)}, ${fmt(vy / mag)}, ${fmt(vz / mag)})`
    : '— (nulový vektor)';

  statsEl.innerHTML =
    `<div><span class="k">v</span> = (${fmt(vx)}, ${fmt(vy)}, ${fmt(vz)})</div>` +
    `<div class="formula"><span class="k">|v|</span> = √(${fmt(vx)}² + ${fmt(vy)}² + ${fmt(vz)}²) = <strong>${fmt(mag)}</strong></div>` +
    `<div><span class="k">v̂</span> = ${unitText}</div>`;
}

updateVector();

function resize() {
  const w = sceneEl.clientWidth || window.innerWidth;
  const h = sceneEl.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

const tmpVec = new THREE.Vector3();
function projectLabel(entry) {
  tmpVec.copy(entry.position).project(camera);
  const w = sceneEl.clientWidth, h = sceneEl.clientHeight;
  const x = (tmpVec.x * 0.5 + 0.5) * w;
  const y = (-tmpVec.y * 0.5 + 0.5) * h;
  const behind = tmpVec.z > 1;
  entry.el.style.left = x + 'px';
  entry.el.style.top = y + 'px';
  entry.el.style.visibility = behind ? 'hidden' : 'visible';
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  labels.forEach(projectLabel);
}
animate();
</script>
</body>
</html>
