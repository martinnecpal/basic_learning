<header class="topbar">
  <button id="sidebar-open" class="icon-btn sidebar-open" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">☰</button>
  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <a href="{{ '/' | relative_url }}">Home</a>
    {% if page.layout == 'chapter' %}
      <span aria-hidden="true">/</span>
      <span>{{ page.title }}</span>
    {% endif %}
  </nav>
  {% if page.layout == 'presentation' %}
    <a class="topbar-action" href="{{ page.embed | relative_url }}" target="_blank" rel="noopener">Otvoriť na celú obrazovku ↗</a>
  {% endif %}
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Prepnúť denný a nočný režim" aria-pressed="false">
    <span class="theme-toggle-icon theme-toggle-icon--sun" aria-hidden="true">☀️</span>
    <span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-thumb"></span></span>
    <span class="theme-toggle-icon theme-toggle-icon--moon" aria-hidden="true">🌙</span>
  </button>
</header>
