# Site settings
title: Basic Learning
description: >-
  Study material covering the basics of algebra, vectors, tensors and matrix
  operations — the foundations needed before learning modeling and
  simulation of metal forming processes.
author: Martin Necpal

# This site is served from https://martinnecpal.github.io/basic_learning/,
# a project page, so every asset/page URL needs this path prefix. Set to ""
# only if this ever moves to a user/org root site (https://<user>.github.io/).
baseurl: "/basic_learning"
url: "https://martinnecpal.github.io"

# Collections
collections:
  chapters:
    output: true
    permalink: /chapters/:slug/

defaults:
  - scope:
      path: ""
      type: chapters
    values:
      layout: chapter
      mathjax: true
  - scope:
      path: ""
      type: pages
    values:
      layout: default

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
